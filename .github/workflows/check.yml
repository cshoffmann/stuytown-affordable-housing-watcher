name: StuyTown affordable unit watcher (single check -- manual/testing only)

# Schedule intentionally disabled: watch.yml now owns 7-10am ET with a
# continuous ~15-second loop instead of a fresh process every 5 minutes.
# Running both on the same schedule would mean two processes polling and
# potentially committing at the same time. This workflow is kept around
# for workflow_dispatch -- a single on-demand check, useful for testing
# or as a one-off sanity check outside the usual window.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for new units
        id: check
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python check_units.py

      - name: Install Playwright (only runs if a new unit was found)
        if: steps.check.outputs.new_unit_found == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Screenshot the listings page
        if: steps.check.outputs.new_unit_found == 'true'
        env:
          SCREENSHOT_FILENAME: ${{ steps.check.outputs.screenshot_filename }}
        run: python screenshot.py

      - name: Commit updated state, events log, and any new screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update watcher state"
          git push
