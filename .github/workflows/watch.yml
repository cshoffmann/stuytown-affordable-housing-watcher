name: StuyTown watcher (7-10am ET, every 2s)

on:
  schedule:
    # BACKUP trigger. The main one is a Google Cloud Scheduler job that calls
    # this workflow's `workflow_dispatch` at 6:13am New York time every day
    # (setup in the README), because GitHub's scheduler is best-effort: in
    # this repo's first week its runs arrived 4-9 hours late or not at all.
    #
    # Every day at 6:13, 6:43, 7:13 ... 9:43 New York time (daylight saving
    # handled by GitHub via `timezone`). A run sets up, opens the auto-apply
    # browsers at 6:59, then checks every 2 seconds until 10:00. If the Google
    # trigger fails, the first of these that shows up takes over for whatever
    # is left of the window. While a watcher is running, these wait in line
    # (see `concurrency` below) and exit within seconds once it's done, so
    # most of them show as "cancelled" in the Actions tab -- that's normal.
    # Off the top of the hour on purpose: GitHub's busiest (most delayed)
    # time is :00.
    - cron: '13,43 6-9 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Test run: check for this many minutes, starting now (0 = normal 7-10am ET run)'
        type: number
        default: 0
      send_test_alert:
        description: 'Send a [TEST] alert to your phone at startup (proves the Pushover secrets work)'
        type: boolean
        default: false
      fake_morning:
        description: 'Test the alerts instead: replay a fake morning (fake units, real [TEST] alerts; no commits)'
        type: boolean
        default: false
      auto_apply_selftest:
        description: 'Test auto-apply instead: fill + submit a FAKE form with your APPLICANT_PROFILE secret, screenshot to your phone'
        type: boolean
        default: false

# Only one watcher at a time: a run triggered while another is going waits
# for it instead of polling (and alerting) twice.
concurrency:
  group: stuytown-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # Earliest possible start (6:00) to 10:00 is 4 hours, plus setup.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Chromium for auto-apply is installed up front; the applier opens it
        # (and loads the StuyTown site) at 6:59, before the first check.
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Watch for new units
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          COMMIT_RESULTS: "true"
          PYTHONUNBUFFERED: "1"  # stream the log live instead of in chunks
          TEST_MINUTES: ${{ inputs.minutes }}
          SEND_TEST_ALERT: ${{ inputs.send_test_alert }}
          FAKE_MORNING: ${{ inputs.fake_morning }}
          # Auto-apply (auto_apply.py). Off unless the AUTO_APPLY_MODE repository
          # variable is on; AUTO_APPLY_MAX_RENT is then required. The profile is one JSON secret.
          APPLICANT_PROFILE: ${{ secrets.APPLICANT_PROFILE }}
          AUTO_APPLY_MODE: ${{ vars.AUTO_APPLY_MODE }}
          AUTO_APPLY_MAX_RENT: ${{ vars.AUTO_APPLY_MAX_RENT }}
          AUTO_APPLY_SELFTEST: ${{ inputs.auto_apply_selftest }}
        run: |
          if [ "$AUTO_APPLY_SELFTEST" = "true" ]; then
            # Only ever touches the fake form in tests/fixtures/apply_site; its
            # (redacted) recording is uploaded below.
            python auto_apply.py --selftest
            exit
          fi
          if [ "$FAKE_MORNING" = "true" ]; then
            # tests/simulate_morning.py never commits; its output is uploaded below instead.
            python tests/simulate_morning.py
            exit
          fi
          args=()
          if [ -n "$TEST_MINUTES" ] && [ "$TEST_MINUTES" != "0" ]; then args+=(--minutes "$TEST_MINUTES"); fi
          if [ "$SEND_TEST_ALERT" = "true" ]; then args+=(--send-test-alert); fi
          python watch_loop.py "${args[@]}"

      - name: Upload the test run's output (fake morning, or the auto-apply self-test's redacted recording)
        if: ${{ always() && (inputs.fake_morning || inputs.auto_apply_selftest) }}
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/output/
