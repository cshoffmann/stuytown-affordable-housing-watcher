name: StuyTown affordable unit watcher

on:
  schedule:
    # Every 5 minutes, 11:00-15:59 UTC.
    # That window covers 7:00-10:59am ET whether NYC is on EDT or EST,
    # so this line never needs manual adjustment for daylight saving --
    # check_units.py does the precise 7-10am ET check itself.
    - cron: '*/5 11-15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for new units
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_units.py

      - name: Install Playwright (only runs if a new unit was found)
        if: steps.check.outputs.new_unit_found == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Screenshot the listings page
        if: steps.check.outputs.new_unit_found == 'true'
        env:
          SCREENSHOT_FILENAME: ${{ steps.check.outputs.screenshot_filename }}
        run: python screenshot.py

      - name: Commit updated state, events log, and any new screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update watcher state"
          git push
